version: '3.4'

services:
  AssetManagement.api:
    image: ${DOCKER_REGISTRY-}AssetManagementapi
    container_name: AssetManagement.Api
    build:
      context: .
      dockerfile: src/AssetManagement.Api/Dockerfile
    depends_on:
      - AssetManagement-db

  AssetManagement-db:
    image: postgres:latest
    container_name: AssetManagement.Db
    environment:
      - POSTGRES_DB=AssetManagement
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/database:/var/lib/postgresql/18/data
    ports:
      - 5432:5432
 